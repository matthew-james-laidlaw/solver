name: Coverage

on: [push, pull_request]

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset coverage -G "Ninja Multi-Config"

      - name: Build CMake
        run: cmake --build build --preset coverage

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
