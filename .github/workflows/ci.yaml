name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: MacOS
            generator: Xcode
          - os: ubuntu-latest
            name: Linux
            generator: Ninja Multi-Config
          - os: windows-latest
            name: Windows
            generator: Visual Studio 18 2026
    
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset base -G "${{ matrix.generator }}"

      - name: Build CMake
        run: cmake --build --preset release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test the app
        run: ./build/bin/Release/solve --function "f(x) = 3x + 5"

  coverage:
    runs-on: ubuntu-latest
    name: Coverage
    
    steps:
      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset coverage -G "Ninja Multi-Config"

      - name: Build CMake
        run: cmake --build --preset coverage

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate coverage report
        run: ./scripts/coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage
